<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">⚡ Pokédex</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 540px;">
        <div class="card-body text-center p-5">
            <div class="display-1 mb-3">🕳️</div>
            <h1 class="h4" th:text="${title} ?: 'Something went wrong'">Something went wrong</h1>
            <p class="text-muted" th:text="${message} ?: 'An unexpected error occurred.'">
                An unexpected error occurred.
            </p>
            <a class="btn btn-success mt-2" th:href="@{/}">Back to Pokédex</a>
        </div>
    </div>
</div>
</body>
</html>

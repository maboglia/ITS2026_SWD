<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Pokédex · ' + ${pokemon.name}">Pokémon detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">⚡ Pokédex</a>
    </div>
</nav>

<div class="container py-4">

    <!-- Back button restores the previous filter + search -->
    <a class="btn btn-outline-secondary mb-3"
       th:href="@{/(type=${selectedType}, q=${query})}">&larr; Back</a>

    <div class="card shadow-sm">
        <div class="row g-0">

            <!-- Artwork from PokeAPI (or placeholder on failure) -->
            <div class="col-md-4 d-flex align-items-center justify-content-center p-4 bg-light">
                <img class="img-fluid pokemon-artwork"
                     th:src="${image.imageUrl}"
                     th:alt="${pokemon.name}"
                     onerror="this.onerror=null;this.src='/img/placeholder.svg';">
            </div>

            <div class="col-md-8">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <h1 class="h3 mb-0" th:text="${pokemon.name}">Bulbasaur</h1>
                        <span class="badge bg-warning text-dark" th:if="${pokemon.legendaryFlag}">Legendary</span>
                    </div>
                    <p class="text-muted mb-3">
                        Pokédex #<span th:text="${pokemon.pokedexNumber}">1</span>
                        · Generation <span th:text="${pokemon.generation}">1</span>
                    </p>

                    <div class="mb-3">
                        <span class="badge bg-secondary me-1" th:text="${pokemon.type1}">Grass</span>
                        <span class="badge bg-secondary" th:if="${pokemon.hasType2()}" th:text="${pokemon.type2}">Poison</span>
                    </div>

                    <!-- Stats from the database -->
                    <h2 class="h6 text-uppercase text-muted">Base stats</h2>
                    <div class="row row-cols-2 row-cols-lg-3 g-2 stat-grid">
                        <div class="col"><div class="stat"><span>HP</span><strong th:text="${pokemon.hp}">45</strong></div></div>
                        <div class="col"><div class="stat"><span>Attack</span><strong th:text="${pokemon.attack}">49</strong></div></div>
                        <div class="col"><div class="stat"><span>Defense</span><strong th:text="${pokemon.defense}">49</strong></div></div>
                        <div class="col"><div class="stat"><span>Sp. Atk</span><strong th:text="${pokemon.spAtk}">65</strong></div></div>
                        <div class="col"><div class="stat"><span>Sp. Def</span><strong th:text="${pokemon.spDef}">65</strong></div></div>
                        <div class="col"><div class="stat"><span>Speed</span><strong th:text="${pokemon.speed}">45</strong></div></div>
                        <div class="col"><div class="stat stat-total"><span>Total</span><strong th:text="${pokemon.total}">318</strong></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

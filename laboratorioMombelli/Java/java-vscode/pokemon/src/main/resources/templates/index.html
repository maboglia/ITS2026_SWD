<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}"> Raccolda dati Pokemon</a>
    </div>
</nav>

<div class="container-fluid py-4">
    <div class="row g-4">

        <!-- Sidebar: all distinct types -->
        <aside class="col-lg-3 col-md-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Types</div>
                <div class="list-group list-group-flush type-list">
                    <a th:href="@{/(q=${query})}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${selectedType == null} ? 'active' : ''">
                        All types
                    </a>
                    <a th:each="t : ${types}"
                       th:href="@{/type/{t}(t=${t}, q=${query})}"
                       th:text="${t}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${selectedType != null and selectedType.equalsIgnoreCase(t)} ? 'active' : ''">
                        Type
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main: search + table -->
        <main class="col-lg-9 col-md-8">

            <!-- Search box; preserves current type filter -->
            <form class="row g-2 mb-3" method="get"
                  th:action="${selectedType != null} ? @{/type/{t}(t=${selectedType})} : @{/}">
                <div class="col">
                    <input type="text" name="q" class="form-control"
                           placeholder="Search by name…" th:value="${query}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-success" type="submit">Search</button>
                </div>
                <div class="col-auto" th:if="${query != null and !query.isEmpty()}">
                    <a class="btn btn-outline-secondary"
                       th:href="${selectedType != null} ? @{/type/{t}(t=${selectedType})} : @{/}">Clear</a>
                </div>
            </form>

            <p class="text-muted small mb-2">
                <span th:text="${pokemonPage.totalElements}">0</span> pokémon
                <span th:if="${selectedType != null}">
                    of type <strong th:text="${selectedType}"></strong></span>
                <span th:if="${query != null and !query.isEmpty()}">
                    matching “<span th:text="${query}"></span>”</span>
            </p>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Name</th>
                            <th scope="col">Type 1</th>
                            <th scope="col">Type 2</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${pokemons}" class="pokemon-row"
                            th:data-href="@{/pokemon/{id}(id=${p.id}, type=${selectedType}, q=${query})}">
                            <td th:text="${p.pokedexNumber}">1</td>
                            <td>
                                <a class="fw-semibold text-decoration-none stretched-name"
                                   th:href="@{/pokemon/{id}(id=${p.id}, type=${selectedType}, q=${query})}"
                                   th:text="${p.name}">Bulbasaur</a>
                            </td>
                            <td><span class="badge bg-secondary" th:text="${p.type1}">Grass</span></td>
                            <td>
                                <span th:if="${p.hasType2()}" class="badge bg-secondary" th:text="${p.type2}">Poison</span>
                                <span th:unless="${p.hasType2()}" class="text-muted">—</span>
                            </td>
                        </tr>
                        <tr th:if="${pokemons.isEmpty()}">
                            <td colspan="4" class="text-center text-muted py-4">No pokémon found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <nav class="mt-3" th:if="${pokemonPage.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${pokemonPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{|${selectedType != null ? '/type/' + selectedType : '/'}|(q=${query}, page=${pokemonPage.number - 1})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link">
                            Page <span th:text="${pokemonPage.number + 1}">1</span>
                            of <span th:text="${pokemonPage.totalPages}">1</span>
                        </span>
                    </li>
                    <li class="page-item" th:classappend="${pokemonPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{|${selectedType != null ? '/type/' + selectedType : '/'}|(q=${query}, page=${pokemonPage.number + 1})}">Next</a>
                    </li>
                </ul>
            </nav>

        </main>
    </div>
</div>

<!-- Make whole rows clickable without a JS framework (progressive enhancement). -->
<script>
    document.querySelectorAll('.pokemon-row').forEach(function (row) {
        row.addEventListener('click', function (e) {
            if (e.target.tagName.toLowerCase() === 'a') return;
            window.location = row.getAttribute('data-href');
        });
    });
</script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Document head start: metadata, title, and linked resources -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="01-print-reverse">
    <meta name="author" content="Maikol">
    <title th:text="${title}">Prodotti</title>

    <!-- Open Graph metadata used by social platforms when the page is shared -->
    <!--
    <meta property="og:title" content="Title">
    <meta property="og:type" content="Type">
    <meta property="og:url" content="URL">
    <meta property="og:description" content="Description of the content">
    <meta property="og:image" content="Image">
    -->
    <!--
    <link rel="icon" href="favicon.ico">
    -->
    <!-- Favicon displayed in the browser tab -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Link to external CSS stylesheet for page styling -->

    <script defer src="./scripts/main.js"></script> <!-- Defer loading of main JavaScript until after HTML parsing -->
    <!-- End of the head section -->
</head>
<body>
    <!-- Main visible content of the page -->

        <div class="container">
            <h1 th:text="${title}">Prodotti</h1>

            <form action="/prodotti" method="post">
                <label for="prodotto">Prodotto:</label>
                <input type="text" id="prodotto" name="prodotto">

                <label for="prezzo">Prezzo:</label>
                <input type="number" id="prezzo" name="prezzo">

                <label for="sezione">Sezione:</label>
                <select id="sezione" name="sezione">
                    <option value="">Tutte</option>
                    <option th:each="s : ${sezioni}" th:value="${s}" th:text="${s}">Sezione</option>
                </select>
                <button type="submit">Aggiungi Prodotto</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Prodotto</th>
                        <th>Prezzo</th>
                        <th>Sezione</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${prodotti}"> <!-- mai passare l'oggetto, ma fare il DTO-->
                        <td th:text="${p.prodotto}">Nome Prodotto</td>
                        <td th:text="${p.prezzo}">Prezzo Prodotto</td>
                        <td th:text="${p.sezione}">Sezione Prodotto</td>
                    </tr>
                </tbody>
            </table>
        </div>
</body>
</html>

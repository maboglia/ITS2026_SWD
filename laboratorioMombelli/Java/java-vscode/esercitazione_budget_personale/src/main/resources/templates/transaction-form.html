<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Transazione - Budget Manager')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4" th:text="${editMode} ? 'Modifica transazione' : 'Nuova transazione'">Transazione</h3>

                    <div th:if="${uploadError}" class="alert alert-danger" th:text="${uploadError}"></div>

                    <form th:action="${editMode} ? @{'/transactions/update/' + ${transactionRequest.id}} : @{/transactions}"
                          th:object="${transactionRequest}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Descrizione</label>
                            <input type="text" th:field="*{description}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data</label>
                                <input type="date" th:field="*{date}" class="form-control">
                                <div class="text-danger small" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Importo (€)</label>
                                <input type="number" step="0.01" th:field="*{amount}" class="form-control">
                                <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo</label>
                                <select th:field="*{type}" class="form-select">
                                    <option th:each="ty : ${types}" th:value="${ty}" th:text="${ty}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoria</label>
                                <input type="text" th:field="*{category}" class="form-control">
                                <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ricevuta (jpg, jpeg, png, pdf)</label>
                            <input type="file" name="receiptFile" class="form-control" accept=".jpg,.jpeg,.png,.pdf">
                            <div class="form-text" th:if="${existingReceipt}">
                                Ricevuta attuale:
                                <a th:href="@{'/' + ${existingReceipt}}" target="_blank">visualizza</a>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salva</button>
                            <a th:href="@{/transactions}" class="btn btn-outline-secondary">Annulla</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Errore - Budget Manager')}"></head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h1 class="display-4 text-danger" th:text="${status} ?: 'Errore'">Errore</h1>
                    <p class="lead" th:text="${errorMessage} ?: 'Si è verificato un errore imprevisto.'">
                        Si è verificato un errore imprevisto.
                    </p>
                    <a th:href="@{/dashboard}" class="btn btn-primary mt-3">Torna alla dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

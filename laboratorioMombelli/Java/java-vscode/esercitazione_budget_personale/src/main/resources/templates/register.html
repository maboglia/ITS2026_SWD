<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrazione - Budget Manager')}"></head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Crea il tuo account</h3>

                    <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" th:field="*{name}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Obiettivo finanziario (opzionale)</label>
                            <input type="text" th:field="*{financialGoal}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('financialGoal')}" th:errors="*{financialGoal}"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrati</button>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        Hai già un account? <a th:href="@{/login}">Accedi</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

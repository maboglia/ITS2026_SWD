<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Profilo - Budget Manager')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Il mio profilo</h2>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="mb-3">Dati personali</h5>
                    <div th:if="${profileSuccess}" class="alert alert-success" th:text="${profileSuccess}"></div>
                    <div th:if="${profileError}" class="alert alert-danger" th:text="${profileError}"></div>

                    <form th:action="@{/profile}" th:object="${userUpdateRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" th:field="*{name}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Obiettivo finanziario</label>
                            <input type="text" th:field="*{financialGoal}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('financialGoal')}" th:errors="*{financialGoal}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Aggiorna profilo</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="mb-3">Cambia password</h5>
                    <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}"></div>
                    <div th:if="${passwordError}" class="alert alert-danger" th:text="${passwordError}"></div>

                    <form th:action="@{/profile/password}" th:object="${passwordChangeRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Password attuale</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nuova password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Conferma password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                        <button type="submit" class="btn btn-warning">Cambia password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

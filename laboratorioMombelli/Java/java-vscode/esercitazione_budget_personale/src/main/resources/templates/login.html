<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login - Budget Manager')}"></head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">💰 Accedi</h3>

                    <div th:if="${param.error}" class="alert alert-danger">Email o password non validi.</div>
                    <div th:if="${param.logout}" class="alert alert-info">Logout effettuato con successo.</div>
                    <div th:if="${param.registered}" class="alert alert-success">Registrazione completata! Effettua il login.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Accedi</button>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        Non hai un account? <a th:href="@{/register}">Registrati</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

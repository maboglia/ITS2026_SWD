<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" >
</head>
<body>
    
    <div class="container">
      <header th:insert="menu.html"></header>
        <h1 th:text="${title}">Document</h1>
        <table>
            <thead>
                <tr>
                    <th>Anno</th>
                    <th>Titolo</th>
                    <th>Descrizione</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.anno}"></td>
                    <td th:text="${event.titolo}"></td>
                    <td th:text="${event.descrizione}"></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>

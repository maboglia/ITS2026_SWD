<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>

</head>
<body>

    <div class="container">
        <h1>Prodotti</h1>

        <form action="" method="post">
            <input type="text" name="nome" placeholder="Nome">
            <input type="text" name="categoria" placeholder="Categoria">
            <input type="number" name="prezzo" placeholder="Prezzo">
            <input type="number" name="giacenza" placeholder="Giacenza">
            <button type="submit">Aggiungi Prodotto</button>
        </form>

        <select name="selectCategoria" id="selectCategoria">
            <option>Seleziona Categoria</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrizione</th>
                    <th>Prezzo</th>
                    <th>Quantità</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

<script>

    const URL = "/api/prodotti";
    const selectCategoria = document.getElementById("selectCategoria");

    fetch("/api/prodotti/categorie")
        .then(response => response.json())
        .then(categorie => {
            categorie.forEach(categoria => {
                const option = document.createElement("option");
                option.textContent = categoria;
                selectCategoria.appendChild(option);
            });
        });

    selectCategoria.addEventListener("change", () => {
        const categoria = selectCategoria.value;
        fetch(`${URL}/categoria/${categoria}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector("tbody");
                tbody.innerHTML = "";
                data.forEach(prodotto => {
                    const tr = document.createElement("tr");
                    const td1 = document.createElement("td");
                    const td2 = document.createElement("td");
                    const td3 = document.createElement("td");
                    const td4 = document.createElement("td");

                    td1.textContent = prodotto.nome;
                    td2.textContent = prodotto.categoria;
                    td3.textContent = prodotto.prezzo;
                    td4.textContent = prodotto.giacenza;

                    tr.append(td1,td2,td3,td4);
                    tbody.appendChild(tr);
                });
            })
    });     

    fetch(URL)
        .then(response => response.json())
        .then(data => {
            const tbody = document.querySelector("tbody");
            data.forEach(prodotto => {
                const tr = document.createElement("tr");
                const td1 = document.createElement("td");
                const td2 = document.createElement("td");
                const td3 = document.createElement("td");
                const td4 = document.createElement("td");
                const deleteBtn = document.createElement("button");
                deleteBtn.classList.add("outline");
                deleteBtn.classList.add("secondary");

                td1.textContent = prodotto.nome;
                td2.textContent = prodotto.categoria;
                td3.textContent = prodotto.prezzo;
                td4.textContent = prodotto.giacenza;

                deleteBtn.textContent = "X";
                deleteBtn.addEventListener("click", () => {
                    fetch(`${URL}/${prodotto.id}`, {
                        method: "DELETE"
                    })
                    .then(() => {
                        tr.remove();
                    });
                });

                tr.append(td1,td2,td3,td4,deleteBtn);
                tbody.appendChild(tr);
            });
        })

</script>

</body>
</html>
